<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance CEDIS B300 · NEXOCORP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2a43;--mut:#5b6b7a;--bg:#eef3f6;--card:#fff;--line:#d9e2e8;--teal:#0e7c86;--ok:#2e9e6b;--tr:#e0a100;--ro:#c4513b;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--ink);color:#fff;padding:22px 28px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
header p{margin:2px 0 0;color:#a9bccd;font-size:.92rem}
.chip{font-size:.85rem;padding:7px 12px;border-radius:99px;background:#16405f;color:#d7e6f3}
.chip.err{background:#6b2a1f;color:#ffd9d1}
main{max-width:1200px;margin:0 auto;padding:22px 18px 40px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.big{font-size:4.2rem;font-weight:800;line-height:1;color:var(--teal);letter-spacing:-.03em}
.big small{font-size:1.6rem}
.hero h2{margin:0 0 4px;font-size:1.05rem}
.hero p{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.seg{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#e5ecf0}
.seg i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.85rem}
.leg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.k span{font-size:.82rem;color:var(--mut)}
.k strong{display:block;font-size:1.7rem;font-weight:700;margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:170px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
section h3{margin:0;padding:14px 16px;font-size:1rem;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid #edf1f4;white-space:nowrap}
th{background:#f6f9fb;font-weight:700;color:var(--mut);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tag{padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700;color:#fff}
.bar{display:inline-block;width:90px;height:8px;background:#e5ecf0;border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{padding:26px;text-align:center;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:6px}
@media(max-width:700px){.hero{grid-template-columns:1fr}.big{font-size:3.4rem}header{padding:18px}}
</style>
</head>
<body>
<header>
  <div><h1>Avance CEDIS B300</h1><p>NEXOCORP · Recepción de mercadería por proveedor</p></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip" id="estado">Cargando datos…</span><button id="btnAct">Actualizar ahora</button></div>
</header>
<main>
  <div class="hero">
    <div class="big" id="pct">–<small>%</small></div>
    <div>
      <h2>Avance de recepción</h2>
      <p>LPN recibidas respecto a las LPN enviadas por los proveedores.</p>
      <div class="seg" id="seg"></div>
      <div class="leg" id="leg"></div>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="filters">
    <select id="fMes" aria-label="Mes"></select>
    <select id="fEst" aria-label="Estado"></select>
    <input id="fBus" type="search" placeholder="Buscar proveedor" aria-label="Buscar proveedor">
  </div>
  <section><h3>Resumen por proveedor</h3><div class="wrap" id="tProv"></div></section>
  <section><h3>Detalle de registros</h3><div class="wrap" id="tDet"></div></section>
</main>
<footer>Los datos se actualizan solos cada 10 minutos desde la hoja “Datos”.</footer>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR5QkazkH1xpGqxl2VYoy0mV-YgHEiS8aDd8AkZnTGAIjNEJs9qeg1H4G0bBIHTLqEQe4oU7YDD2Ska/pub?gid=1838516268&single=true&output=csv';
const REFRESH=10*60*1000;
const RESPALDO=`MES,ESTADO,NOMBRE DE PROVEEDOR,Fecha Personal 1,Informacion de Origen,SKU TOTALES,Suma de Recuento de LPN recibidas,Suma de Recuento de LPN enviadas
NOVIEMBRE,Verified,MEGALABS BOLIVIA S.R.L.,,,159,178,178
NOVIEMBRE,Receiving Complete,MEGALABS BOLIVIA S.R.L.,,,2,2,2
NOVIEMBRE,Verified,MEGALABS BOLIVIA S.R.L.,,,16,20,20
NOVIEMBRE,In Transit,PHARMATECH BOLIVIANA SA.,,,52,0,55
NOVIEMBRE,Verified,ELITE BRANDS S.R.L.,,,199,204,204
NOVIEMBRE,In Transit,INDUSTRIA QUIMICO FARMACEUTICA SIGMA CORP S.R.L.,,,21,0,21
NOVIEMBRE,Verified,NIPRO MEDICAL CORPORATION-SUCURSAL BOLIVIA,,,1,1,1
NOVIEMBRE,In Transit,REMBERTO RODRIGUEZ DAVIEDS,,,6,0,6
NOVIEMBRE,In Transit,INDUSTRIA QUIMICO FARMACEUTICA SIGMA CORP S.R.L.,,,2,0,2
NOVIEMBRE,Receiving Complete,LABORATORIOS EUROFARMA BOLIVIA S.R.L.,,,2,2,2`;

// Traducción de estados (inglés → español). Agrega aquí cualquier estado nuevo.
const ES={'verified':'Verificado','receiving complete':'Recepción completa','in transit':'En tránsito','received':'Recibido','receiving':'En recepción','pending':'Pendiente','cancelled':'Cancelado','canceled':'Cancelado','closed':'Cerrado','open':'Abierto','completed':'Completado','shipped':'Enviado','in progress':'En proceso','draft':'Borrador','rejected':'Rechazado','partially received':'Recibido parcial','partial':'Parcial'};
const COL={'verificado':'#2e9e6b','recepción completa':'#0e7c86','en tránsito':'#e0a100'};
const EXTRA=['#7a5cc4','#c4513b','#5b6b7a','#2f6fb3'];
const trad=s=>{const k=(s||'').trim();return ES[k.toLowerCase()]||k};
const color=e=>COL[e.toLowerCase()]||EXTRA[[...e].reduce((a,c)=>a+c.charCodeAt(0),0)%EXTRA.length];
const num=v=>{const x=parseFloat(String(v||'').replace(/[^\d.\-]/g,''));return isNaN(x)?0:x};
const fmt=n=>n.toLocaleString('es-BO');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseCSV(t){const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==',')(r.push(c),c='');
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
  else c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}
 const h=rows.shift().map(x=>x.trim());
 return rows.filter(x=>x.some(v=>v.trim())).map(x=>({mes:(x[0]||'').trim(),est:trad(x[1]),prov:(x[2]||'').trim(),fecha:(x[3]||'').trim(),origen:(x[4]||'').trim(),sku:num(x[5]),rec:num(x[6]),env:num(x[7])}))}

let DATOS=[],ultima=null,prox=Date.now()+REFRESH;
const $=id=>document.getElementById(id);

async function cargar(){
 try{
  const r=await fetch(CSV_URL+'&t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error(r.status);
  DATOS=parseCSV(await r.text());ultima=new Date();setEstado(true);
 }catch(e){
  if(!DATOS.length)DATOS=parseCSV(RESPALDO);
  setEstado(false);
 }
 prox=Date.now()+REFRESH;armarFiltros();pintar();
}
function setEstado(ok){const c=$('estado');
 if(ok){c.className='chip';c.textContent='Actualizado a las '+ultima.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'})}
 else{c.className='chip err';c.textContent='Sin conexión con la hoja: se muestran datos de respaldo'}}

function opciones(sel,vals,todos){const a=sel.value;sel.innerHTML='<option value="">'+todos+'</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');if(vals.includes(a))sel.value=a}
function armarFiltros(){
 opciones($('fMes'),[...new Set(DATOS.map(d=>d.mes))].filter(Boolean),'Todos los meses');
 opciones($('fEst'),[...new Set(DATOS.map(d=>d.est))].filter(Boolean),'Todos los estados')}

function pintar(){
 const m=$('fMes').value,e=$('fEst').value,b=$('fBus').value.trim().toLowerCase();
 const D=DATOS.filter(d=>(!m||d.mes==m)&&(!e||d.est==e)&&(!b||d.prov.toLowerCase().includes(b)));
 const S=k=>D.reduce((a,d)=>a+d[k],0);
 const rec=S('rec'),env=S('env'),sku=S('sku'),pend=Math.max(env-rec,0);
 const pct=env?Math.min(rec/env*100,100):0;
 $('pct').innerHTML=pct.toFixed(1).replace('.',',')+'<small>%</small>';
 // barra segmentada por estado (en LPN enviadas)
 const porEst={};D.forEach(d=>porEst[d.est]=(porEst[d.est]||0)+d.env);
 const tot=Object.values(porEst).reduce((a,b)=>a+b,0)||1;
 $('seg').innerHTML=Object.entries(porEst).map(([k,v])=>`<i title="${esc(k)}: ${fmt(v)} LPN" style="width:${v/tot*100}%;background:${color(k)}"></i>`).join('');
 $('leg').innerHTML=Object.entries(porEst).map(([k,v])=>`<span><b style="background:${color(k)}"></b>${esc(k)}: ${fmt(v)} LPN (${(v/tot*100).toFixed(0)}%)</span>`).join('');
 const provs=new Set(D.map(d=>d.prov));
 $('kpis').innerHTML=[['Proveedores',provs.size],['SKU totales',sku],['LPN enviadas',env],['LPN recibidas',rec],['LPN pendientes de recibir',pend],['Registros',D.length]]
  .map(([a,v])=>`<div class="k"><span>${a}</span><strong>${fmt(v)}</strong></div>`).join('');
 // resumen por proveedor
 const P={};D.forEach(d=>{const p=P[d.prov]||(P[d.prov]={sku:0,rec:0,env:0,est:new Set()});p.sku+=d.sku;p.rec+=d.rec;p.env+=d.env;p.est.add(d.est)});
 const L=Object.entries(P).sort((a,b)=>b[1].env-a[1].env);
 $('tProv').innerHTML=L.length?`<table><thead><tr><th>Proveedor</th><th>Estados</th><th class="n">SKU totales</th><th class="n">LPN enviadas</th><th class="n">LPN recibidas</th><th class="n">Pendientes</th><th>Avance</th></tr></thead><tbody>`+
  L.map(([p,v])=>{const a=v.env?Math.min(v.rec/v.env*100,100):0;return `<tr><td>${esc(p)}</td><td>${[...v.est].map(s=>`<span class="tag" style="background:${color(s)}">${esc(s)}</span>`).join(' ')}</td><td class="n">${fmt(v.sku)}</td><td class="n">${fmt(v.env)}</td><td class="n">${fmt(v.rec)}</td><td class="n">${fmt(Math.max(v.env-v.rec,0))}</td><td><span class="bar"><i style="width:${a}%"></i></span>${a.toFixed(0)}%</td></tr>`}).join('')+'</tbody></table>':'<div class="empty">No hay datos con los filtros elegidos.</div>';
 // detalle (columnas de fecha/origen solo si traen datos)
 const cf=DATOS.some(d=>d.fecha),co=DATOS.some(d=>d.origen);
 $('tDet').innerHTML=D.length?`<table><thead><tr><th>Mes</th><th>Estado</th><th>Proveedor</th>${cf?'<th>Fecha</th>':''}${co?'<th>Información de origen</th>':''}<th class="n">SKU totales</th><th class="n">LPN recibidas</th><th class="n">LPN enviadas</th></tr></thead><tbody>`+
  D.map(d=>`<tr><td>${esc(d.mes)}</td><td><span class="tag" style="background:${color(d.est)}">${esc(d.est)}</span></td><td>${esc(d.prov)}</td>${cf?`<td>${esc(d.fecha)}</td>`:''}${co?`<td>${esc(d.origen)}</td>`:''}<td class="n">${fmt(d.sku)}</td><td class="n">${fmt(d.rec)}</td><td class="n">${fmt(d.env)}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">No hay registros con los filtros elegidos.</div>';
}
['fMes','fEst'].forEach(i=>$(i).addEventListener('change',pintar));
$('fBus').addEventListener('input',pintar);
$('btnAct').addEventListener('click',cargar);
cargar();setInterval(cargar,REFRESH);
</script>
</body>
</html>
